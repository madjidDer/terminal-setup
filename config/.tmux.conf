# Utiliser Ctrl+A au lieu de Ctrl+B
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Activer la souris (facultatif)
set -g mouse on

# Numéroter les fenêtres à partir de 1
set -g base-index 1
setw -g pane-base-index 1

# Diviser les panneaux
bind | split-window -h
bind - split-window -v

# Naviguer entre les panneaux avec Alt + flèches
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Historique de 50 000 lignes
set -g history-limit 50000
